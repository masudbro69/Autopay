name: Deploy to Firebase (live)

# Deploys Firestore rules + Cloud Functions + Hosting to your real
# Firebase project (auto-pay-66e8c). Runs automatically on every push to
# the tracked branch once the FIREBASE_TOKEN secret is configured.
#
# To generate the token locally:
#   npm i -g firebase-tools && firebase login:ci
# Then add it as a GitHub secret named FIREBASE_TOKEN.

on:
  push:
    branches: [arena/01a049de-autopay, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install function dependencies
        run: npm ci --prefix functions

      - name: Deploy to Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::warning::FIREBASE_TOKEN secret is not set — skipping Firebase deploy. Add it to enable live deployment."
            exit 0
          fi
          npx --yes firebase-tools@15.28.2 deploy \
            --only functions,firestore:rules,firestore:indexes,hosting \
            --project auto-pay-66e8c \
            --token "$FIREBASE_TOKEN" \
            --force
