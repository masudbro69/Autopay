name: Deploy to GitHub Pages

# Serves the static web app (hosting/) on GitHub Pages.
# On *.github.io the app runs in sandbox mode (fully functional UI,
# no fake data) — Firebase Hosting (via the other workflow) runs LIVE.

on:
  push:
    branches: [arena/01a049de-autopay, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build static site (copy hosting → root)
        run: |
          mkdir -p _site
          cp -r hosting/. _site/
          # Hash-routed SPA: any unknown path serves the app shell.
          cp _site/index.html _site/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
